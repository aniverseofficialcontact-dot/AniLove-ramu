// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Ensure submodules (including capacitor/android) compile with Java 17 if they request higher versions
subprojects {
    afterEvaluate { sub ->
        try {
            if (sub.hasProperty('android')) {
                sub.android.compileOptions.sourceCompatibility = JavaVersion.VERSION_17
                sub.android.compileOptions.targetCompatibility = JavaVersion.VERSION_17
                try {
                    sub.android.kotlinOptions.jvmTarget = '17'
                } catch(ignore) {}
            }
        } catch(ignore) {}
    }
}
