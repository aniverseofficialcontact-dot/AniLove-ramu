/*
|--------------------------------------------------------------------------
| Adblock detection
|--------------------------------------------------------------------------
*/

async function detectAdblock() {
  return new Promise((resolve) => {
    const bait = document.createElement("div");

    bait.className = "adsbox ad-banner ad-placement";

    bait.style.position = "absolute";
    bait.style.left = "-9999px";
    bait.style.top = "-9999px";
    bait.style.width = "1px";
    bait.style.height = "1px";

    document.body.appendChild(bait);

    setTimeout(() => {
      const blocked =
        bait.offsetHeight === 0 ||
        bait.offsetWidth === 0 ||
        bait.clientHeight === 0 ||
        bait.clientWidth === 0;

      bait.remove();

      resolve(blocked);
    }, 50);
  });
}

/*

*/

async function detectBrowser() {
  /*
   * Brave
   */
  try {
    if (
      typeof navigator.brave !== "undefined" &&
      navigator.brave &&
      typeof navigator.brave.isBrave === "function"
    ) {
      const isBrave = await navigator.brave.isBrave();

      if (isBrave) {
        return "brave";
      }
    }
  } catch (error) {
    console.warn("[BROWSER] Brave detection failed:", error);
  }

  /*
   * User Agent
   */

  const ua = navigator.userAgent.toLowerCase();

   * Edge
   */

  if (ua.includes("edg/")) {
    return "edge";
  }

  /*
   * Opera
   */

  if (ua.includes("opr/") || ua.includes("opera")) {
    return "opera";
  }

  /*
   * Firefox
   */

  if (ua.includes("firefox/") || ua.includes("fxios/")) {
    return "firefox";
  }

  /*
   * Safari
   */

  if (
    ua.includes("safari/") &&
    !ua.includes("chrome/") &&
    !ua.includes("chromium/")
  ) {
    return "safari";
  }

  /*
   * Chrome / Chromium
   */

  if (ua.includes("chrome/") || ua.includes("chromium/")) {
    return "chrome";
  }

  return "other";
}

/*
|--------------------------------------------------------------------------
| Fingerprint
|--------------------------------------------------------------------------
*/

async function getVisitorKey() {
  /*
   * Check whether FingerprintJS loaded
   */

  if (typeof FingerprintJS === "undefined") {
    console.warn("[FINGERPRINT] FingerprintJS is not loaded");

    /*
     * Fallback visitor key
     *
     * This does NOT stop tracking.
     */

    const fallback = [
      navigator.userAgent,
      navigator.language,
      navigator.platform,
      screen.width,
      screen.height,
      screen.colorDepth,
    ].join("|");

    /*
     * Generate SHA-256 if available
     */

    try {
      if (window.crypto && window.crypto.subtle) {
        const data = new TextEncoder().encode(fallback);

        const hash = await crypto.subtle.digest("SHA-256", data);

        return Array.from(new Uint8Array(hash))
          .map((b) => b.toString(16).padStart(2, "0"))
          .join("");
      }
    } catch (error) {
      console.warn("[FINGERPRINT] Fallback hash failed:", error);
    }

    /*
     * Last fallback
     */

    return fallback;
  }

  /*
   * FingerprintJS available
   */

  try {
    const fp = await FingerprintJS.load();

    const result = await fp.get();

    if (result && result.visitorId) {
      return result.visitorId;
    }
  } catch (error) {
    console.warn("[FINGERPRINT] FingerprintJS failed:", error);
  }

  return null;
}

/*
|--------------------------------------------------------------------------
| Track file view
|--------------------------------------------------------------------------
*/

async function trackFileView(fileId, vtoken) {
  if (!fileId) {
    return;
  }

  try {
    /*
    |--------------------------------------------------------------------------
    | Visitor key
    |--------------------------------------------------------------------------
    */

    const visitorKey = await getVisitorKey();

    /*
    |--------------------------------------------------------------------------
    | Adblock
    |--------------------------------------------------------------------------
    */

    const adblock = await detectAdblock();

    /*
    |--------------------------------------------------------------------------
    | Browser
    |--------------------------------------------------------------------------
    */

    const browser = await detectBrowser();

    /*
    |--------------------------------------------------------------------------
    | Debug
    |--------------------------------------------------------------------------
    */

    console.log("[TRACK] browser:", browser);

    console.log("[TRACK] fingerprint:", visitorKey);

    console.log("[TRACK] adblock:", adblock);

    /*
    |--------------------------------------------------------------------------
    | Parameters
    |--------------------------------------------------------------------------
    */

    const params = new URLSearchParams();

    params.append("file_slug", fileId);

    params.append("token", vtoken);

    params.append("view_type", "embed");

    params.append("visitor_key", visitorKey || "");

    params.append("adblock", adblock ? "1" : "0");

    params.append("browser", browser);

    /*
    |--------------------------------------------------------------------------
    | Debug request
    |--------------------------------------------------------------------------
    */

    console.log("[TRACK] Sending:", params.toString());

    /*
    |--------------------------------------------------------------------------
    | Send request
    |--------------------------------------------------------------------------
    */

    const response = await fetch("/embeds/track_view.php", {
      method: "POST",

      credentials: "same-origin",

      headers: {
        "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8",
      },

      body: params.toString(),
    });

    /*
    |--------------------------------------------------------------------------
    | Response
    |--------------------------------------------------------------------------
    */

    const text = await response.text();

    console.log("[TRACK] Server response:", text);

    let data;

    try {
      data = JSON.parse(text);
    } catch (error) {
      console.error("[TRACK] Invalid JSON response:", text);

      return;
    }

    /*
    |--------------------------------------------------------------------------
    | Result
    |--------------------------------------------------------------------------
    */

    if (data.ok) {
      console.log("View recorded", {
        browser: data.browser,

        traffic_type: data.traffic_type,

        payable: data.is_payable,
      });
    } else {
      console.warn("View not recorded", data);
    }
  } catch (error) {
    console.error("[TRACK] Error tracking view:", error);
  }
}
