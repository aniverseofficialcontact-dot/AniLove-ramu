<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AniLove - Anime Tracker & Discovery</title>
    <meta name="description" content="Premium anime discovery, airing schedule, library tracking, watch progress, and streaming companion." />
    
    <!-- PWA & Android Meta Tags -->
    <meta name="theme-color" content="#090d16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AniLove" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="shortcut icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icon-512.svg" />

    <!-- Performance: Preload cinematic assets to prevent startup lag/blanks -->
    <link rel="preload" href="/assets/loading_video.mp4" as="video" type="video/mp4" />
    <link rel="preload" href="/assets/anime_sunset_city.jpg" as="image" />

    <meta property="og:title" content="AniLove - Anime Tracker & Discovery" />
    <meta property="og:description" content="Premium anime discovery, airing schedule, and streaming companion." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-slate-950 text-slate-100 select-none overflow-x-hidden antialiased">
    <div id="app-global-loader" style="position: fixed; inset: 0; width: 100vw; height: 100vh; background-color: #090d16; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999999; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
      <div style="display: flex; gap: 4px;">
        <span style="font-size: 3.5rem; font-weight: 900; background: linear-gradient(to right, #818cf8, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 25px rgba(168,85,247,0.55));">Ani</span>
        <span style="font-size: 3.5rem; font-weight: 900; background: linear-gradient(to right, #ec4899, #f43f5e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 25px rgba(236,72,153,0.55));">Love</span>
      </div>
      <p style="margin-top: 16px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.25em; text-transform: uppercase; color: rgba(216,180,254,0.45);">Loading Your Universe</p>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration notice:', err);
          });
        });
      }
    </script>
  </body>
</html>
